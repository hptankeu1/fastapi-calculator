<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastAPI Calculator</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --accent: #0b6e4f;
      --accent-hover: #095c42;
      --error: #b42318;
      --border: #d9dde3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
    button {
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    #result {
      margin-top: 20px;
      padding: 14px;
      min-height: 50px;
      border-radius: 8px;
      background: var(--bg);
      font-size: 1.1rem;
      font-weight: 600;
    }
    #result.error { color: var(--error); }
  </style>
</head>
<body>
  <main class="card">
    <h1>FastAPI Calculator</h1>
    <p class="sub">Enter two numbers and choose an operation.</p>

    <form id="calculatorForm" onsubmit="return false;">
      <label for="a">First number</label>
      <input type="number" id="a" step="any" placeholder="e.g. 10" required />

      <label for="b">Second number</label>
      <input type="number" id="b" step="any" placeholder="e.g. 5" required />

      <div class="buttons">
        <button type="button" onclick="calculate('add')" aria-label="Add">+</button>
        <button type="button" onclick="calculate('subtract')" aria-label="Subtract">−</button>
        <button type="button" onclick="calculate('multiply')" aria-label="Multiply">×</button>
        <button type="button" onclick="calculate('divide')" aria-label="Divide">÷</button>
      </div>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    async function calculate(operation) {
      const resultDiv = document.getElementById("result");
      const aVal = document.getElementById("a").value;
      const bVal = document.getElementById("b").value;
      resultDiv.classList.remove("error");

      if (aVal === "" || bVal === "") {
        resultDiv.classList.add("error");
        resultDiv.innerText = "Error: Please enter both numbers.";
        return;
      }

      try {
        const response = await fetch(`/${operation}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ a: parseFloat(aVal), b: parseFloat(bVal) }),
        });
        const data = await response.json();
        if (response.ok) {
          resultDiv.innerText = `Calculation Result: ${data.result}`;
        } else {
          resultDiv.classList.add("error");
          resultDiv.innerText = `Error: ${data.error}`;
        }
      } catch (err) {
        resultDiv.classList.add("error");
        resultDiv.innerText = "Error: Could not reach the server.";
      }
    }
  </script>
</body>
</html>
